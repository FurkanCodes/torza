# Build Torza from this source tree instead of pulling the published image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build api
services:
  api:
    image: torza:local
    build:
      context: ..
  stream:
    image: torza:local
  ingest:
    image: torza:local
  scheduler:
    image: torza:local
