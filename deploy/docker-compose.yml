# Torza on one machine. Settings come from .env next to this file (the
# installer writes it; see docs/INSTALL.md). Run from this folder:
#   docker compose up -d
# COMPOSE_PROFILES=caddy in .env adds Caddy for HTTPS on your own domain.
# Building from source instead of pulling: add -f docker-compose.build.yml.
name: torza

x-torza-env: &torza-env
  DATABASE_URL: postgres://torza:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/torza?sslmode=disable
  DATA_DIR: /data
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-}
  SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY in .env}
  QBIT_URL: http://qbittorrent:8090
  QBIT_USER: ${QBIT_USER:-admin}
  QBIT_PASS: ${QBIT_PASS:-}
  LINK_TTL: ${LINK_TTL:-6h}
  MAX_ACTIVE_PER_USER: ${MAX_ACTIVE_PER_USER:-3}
  MAX_TORRENT_BYTES: ${MAX_TORRENT_BYTES:-100GB}
  CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-0}
  CACHE_MIN_FREE_BYTES: ${CACHE_MIN_FREE_BYTES:-20GB}
  EVICT_IDLE_FOR: ${EVICT_IDLE_FOR:-6h}
  INGEST_FETCHERS: ${INGEST_FETCHERS:-qbittorrent}

x-torza: &torza
  image: ${TORZA_IMAGE:-ghcr.io/furkancodes/torza:latest}
  restart: unless-stopped
  environment: *torza-env
  depends_on: [postgres]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: torza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: torza
    volumes:
      - pgdata:/var/lib/postgresql/data

  qbittorrent:
    # Pin to a specific version tag after the first successful deploy.
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Same port inside and outside: qBittorrent rejects requests whose Host
      # header port differs from its own.
      WEBUI_PORT: "8090"
      TORRENTING_PORT: "6881"
    ports:
      - "${TORRENT_PORT:-6881}:6881"
      - "${TORRENT_PORT:-6881}:6881/udp"
      # Web UI, reachable only from the server itself (use an SSH tunnel).
      # (Open it as http://localhost:8090; another host port works for
      # Torza but qBittorrent's Host-header check refuses browsers on it.)
      - "127.0.0.1:${QBIT_UI_PORT:-8090}:8090"
    volumes:
      # A named volume, or a folder (the installer uses ./qbittorrent so it
      # can write the first config with the Web UI password).
      - ${QBIT_CONFIG:-qbit_config}:/config
      # Must be the same path (/data) as in ingest: Torza tells qBittorrent
      # where to save each torrent.
      - ${DATA_PATH:-./data}:/data

  api:
    <<: *torza
    command: ["api"]
    ports:
      # On this machine only, unless BIND_ADDR opens it (local.sh lan on).
      # Caddy and Tailscale reach it here.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"

  stream:
    <<: *torza
    command: ["stream"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${STREAM_PORT:-8081}:8081"
    volumes:
      - ${DATA_PATH:-./data}:/data:ro

  ingest:
    <<: *torza
    command: ["ingest"]
    depends_on: [postgres, qbittorrent]
    volumes:
      - ${DATA_PATH:-./data}:/data

  scheduler:
    <<: *torza
    command: ["scheduler"]
    volumes:
      - ${DATA_PATH:-./data}:/data

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, stream]

volumes:
  pgdata:
  qbit_config:
  caddy_data:
  caddy_config:
