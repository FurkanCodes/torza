name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # A real Postgres for database tests. Tests that need it read
      # TEST_DATABASE_URL and skip when it isn't set, so `go test` still
      # passes on a machine without a database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: torza
          POSTGRES_PASSWORD: torza
          POSTGRES_DB: torza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://torza:torza@localhost:5432/torza_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  docker:
    # Builds the server image so a broken Dockerfile shows up on every push,
    # not at deploy time. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t torza:ci .
